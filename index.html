<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kashti Floor Attendance</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; }
    .card { background: #ffffff; width: 100%; max-width: 400px; padding: 22px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
    h2 { color: #1a73e8; margin: 0 0 5px 0; }
    p { color: #666; font-size: 14px; margin: 0 0 15px 0; }

    /* Live Google Map Box */
    .map-wrapper {
      position: relative;
      width: 100%;
      height: 230px;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 14px;
      border: 1px solid #d0d7de;
      background: #e8eaed;
    }
    #googleMapFrame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    .map-loading {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f8f9fa;
      color: #555;
      font-size: 13px;
      font-weight: 500;
    }

    /* Refresh Location Button */
    .recenter-btn {
      position: absolute;
      bottom: 12px;
      right: 12px;
      z-index: 10;
      width: 38px;
      height: 38px;
      background: #ffffff;
      color: #1a73e8;
      border: 1px solid #ccc;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      padding: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    }
    .recenter-btn:hover { background: #f1f3f4; }

    input { width: 100%; padding: 14px; font-size: 18px; border: 1px solid #ccc; border-radius: 8px; text-align: center; margin-bottom: 12px; outline: none; }
    input:focus { border-color: #1a73e8; }
    
    .submit-btn { width: 100%; background: #1a73e8; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; }
    .submit-btn:disabled { background: #94bce8; cursor: not-allowed; }
    
    .status-box { display: none; margin-top: 15px; padding: 15px; border-radius: 8px; text-align: left; font-size: 14px; }
    .success { background: #e6f4ea; color: #137333; border: 1px solid #ceedd5; }
    .error { background: #fce8e6; color: #c5221f; border: 1px solid #fad2cf; }
    .warning { background: #fff4e5; color: #663c00; border: 1px solid #ffe0b2; font-weight: bold; text-align: center; }
    .location-info { font-size: 13px; color: #555; margin-top: 10px; line-height: 1.5; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Kashti Floor Attendance</h2>
    <p>Mark Attendance from Office Floor</p>

    <!-- Live Google Map -->
    <div class="map-wrapper">
      <div id="mapLoader" class="map-loading">📍 Detecting live Google Map location...</div>
      <iframe id="googleMapFrame" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      
      <button type="button" class="recenter-btn" onclick="refreshLiveLocation()" title="Refresh my live location">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="3 11 22 2 13 21 11 13 3 11"></polygon>
        </svg>
      </button>
    </div>

    <input type="tel" id="mobile" placeholder="Enter 10-Digit Mobile" maxlength="10">
    <button id="btn" class="submit-btn" onclick="submitAttendance()">⚡ Mark Attendance</button>
    <div id="locStatus" class="location-info">📍 Checking GPS location...</div>

    <div id="resultBox" class="status-box"></div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzuHQ6lXFejJohyBDISOBzwEHnns_emrLvn6MQqfA_0XhPckMXZBLenidFwbfHAvwDw/exec";
    
    // Exact Office Floor Coordinates matching Google Apps Script
    const OFFICE_LAT = 12.910150;
    const OFFICE_LNG = 77.592719;
    const ALLOWED_RADIUS = 100; // meters

    let currentLat = null;
    let currentLng = null;
    let mapInitialized = false;

    function renderGoogleMap(lat, lng) {
      const iframe = document.getElementById("googleMapFrame");
      const loader = document.getElementById("mapLoader");
      iframe.src = `https://maps.google.com/maps?q=${lat},${lng}&z=17&output=embed`;
      loader.style.display = "none";
      mapInitialized = true;
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    function handlePositionUpdate(pos) {
      currentLat = pos.coords.latitude;
      currentLng = pos.coords.longitude;
      const distFromOffice = calculateDistance(currentLat, currentLng, OFFICE_LAT, OFFICE_LNG);

      if (!mapInitialized) {
        renderGoogleMap(currentLat, currentLng);
      }

      const zoneBadge = distFromOffice <= ALLOWED_RADIUS
        ? `<span style="color:#137333; font-weight:bold;">✅ Inside Office Floor Zone</span>`
        : `<span style="color:#c5221f; font-weight:bold;">⚠️ Go to your office floor to mark attendance!</span>`;

      document.getElementById("locStatus").innerHTML = zoneBadge;
    }

    function handlePositionError() {
      document.getElementById("mapLoader").innerText = "⚠️ GPS Permission Required";
      document.getElementById("locStatus").innerText = "⚠️ Please turn on Phone Location (GPS) and refresh!";
    }

    function refreshLiveLocation() {
      if (navigator.geolocation) {
        document.getElementById("locStatus").innerText = "🔄 Refreshing live GPS...";
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            handlePositionUpdate(pos);
            renderGoogleMap(pos.coords.latitude, pos.coords.longitude);
          },
          handlePositionError,
          { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
        );
      }
    }

    window.onload = function() {
      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(
          handlePositionUpdate,
          handlePositionError,
          { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
        );
      } else {
        document.getElementById("locStatus").innerText = "❌ GPS not supported on this device.";
      }
    };

    function submitAttendance() {
      const mobile = document.getElementById("mobile").value.trim();
      const btn = document.getElementById("btn");

      if (mobile.length < 10) {
        showMsg("Please enter a valid 10-digit mobile number.", "error");
        return;
      }

      if (!currentLat || !currentLng) {
        showMsg("GPS Location required! Please turn on phone Location/GPS and refresh.", "warning");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Verifying Location...";

      fetch(`${SCRIPT_URL}?mobile=${mobile}&lat=${currentLat}&lng=${currentLng}`)
        .then(res => res.json())
        .then(data => {
          btn.disabled = false;
          btn.innerText = "⚡ Mark Attendance";

          if (data.success) {
            const html = `
              <b>✅ Attendance Marked!</b><br>
              <b>Name:</b> ${data.empName}<br>
              <b>Emp ID:</b> ${data.empId}<br>
              <b>Status:</b> ${data.status}<br>
              <b>Distance:</b> ${data.distanceMeters}m from office<br>
              <b>Time:</b> ${data.time}
            `;
            showMsg(html, "success");
          } else if (data.isLocationError) {
            showMsg(`📍 <b>${data.message}</b>`, "warning");
          } else {
            showMsg(`❌ ${data.message}`, "error");
          }
        })
        .catch(err => {
          btn.disabled = false;
          btn.innerText = "⚡ Mark Attendance";
          showMsg("❌ Connection error. Try again.", "error");
        });
    }

    function showMsg(msg, type) {
      const box = document.getElementById("resultBox");
      box.innerHTML = msg;
      box.className = `status-box ${type}`;
      box.style.display = "block";
    }
  </script>

</body>
</html>
