<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kashti Office Attendance</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; }
    .card { background: #ffffff; width: 100%; max-width: 400px; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
    h2 { color: #1a73e8; margin-bottom: 5px; }
    p { color: #666; font-size: 14px; margin-bottom: 20px; }
    input { width: 100%; padding: 14px; font-size: 18px; border: 1px solid #ccc; border-radius: 8px; text-align: center; margin-bottom: 15px; outline: none; }
    button { width: 100%; background: #1a73e8; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; }
    .status-box { display: none; margin-top: 15px; padding: 15px; border-radius: 8px; text-align: left; font-size: 14px; }
    .success { background: #e6f4ea; color: #137333; border: 1px solid #ceedd5; }
    .error { background: #fce8e6; color: #c5221f; border: 1px solid #fad2cf; }
    .warning { background: #fff4e5; color: #663c00; border: 1px solid #ffe0b2; font-weight: bold; text-align: center; }
    .location-info { font-size: 12px; color: #666; margin-top: 8px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Kashti Attendance</h2>
    <p>Mark Attendance from Office Floor</p>

    <input type="tel" id="mobile" placeholder="Enter 10-Digit Mobile" maxlength="10">
    <button id="btn" onclick="submitAttendance()">⚡ Mark Attendance</button>
    <div id="locStatus" class="location-info">📍 Checking GPS location...</div>

    <div id="resultBox" class="status-box"></div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzuHQ6lXFejJohyBDISOBzwEHnns_emrLvn6MQqfA_0XhPckMXZBLenidFwbfHAvwDw/exec";
    
    let currentLat = null;
    let currentLng = null;

    // Get phone location on load
    window.onload = function() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            currentLat = pos.coords.latitude;
            currentLng = pos.coords.longitude;
            document.getElementById("locStatus").innerText = "📍 Location Ready";
          },
          (err) => {
            document.getElementById("locStatus").innerText = "⚠️ Please enable Phone Location (GPS)!";
          },
          { enableHighAccuracy: true, timeout: 10000 }
        );
      }
    };

    function submitAttendance() {
      const mobile = document.getElementById("mobile").value.trim();
      const btn = document.getElementById("btn");

      if (mobile.length < 10) {
        showMsg("Please enter a valid 10-digit mobile number.", "error");
        return;
      }

      if (!currentLat || !currentLng) {
        showMsg("GPS Location required! Please turn on phone Location/GPS and refresh.", "warning");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Verifying Location...";

      fetch(`${SCRIPT_URL}?mobile=${mobile}&lat=${currentLat}&lng=${currentLng}`)
        .then(res => res.json())
        .then(data => {
          btn.disabled = false;
          btn.innerText = "⚡ Mark Attendance";

          if (data.success) {
            const html = `
              <b>✅ Attendance Marked!</b><br>
              <b>Name:</b> ${data.empName}<br>
              <b>Emp ID:</b> ${data.empId}<br>
              <b>Status:</b> ${data.status}<br>
              <b>Time:</b> ${data.time}
            `;
            showMsg(html, "success");
          } else if (data.isLocationError) {
            // SHOW THE OFFICE FLOOR WARNING MESSAGE
            showMsg(`📍 <b>${data.message}</b>`, "warning");
          } else {
            showMsg(`❌ ${data.message}`, "error");
          }
        })
        .catch(err => {
          btn.disabled = false;
          btn.innerText = "⚡ Mark Attendance";
          showMsg("❌ Connection error. Try again.", "error");
        });
    }

    function showMsg(msg, type) {
      const box = document.getElementById("resultBox");
      box.innerHTML = msg;
      box.className = `status-box ${type}`;
      box.style.display = "block";
    }
  </script>

</body>
</html>
